<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leanback Docs TV - File Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900 border border-white/10 rounded-[40px] p-10 shadow-2xl text-center">
        <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-[0_0_40px_rgba(37,99,235,0.4)]">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        
        <h1 class="text-3xl font-extrabold mb-4 tracking-tight">Transfer to TV</h1>
        <p class="text-slate-400 mb-10 leading-relaxed">Select a document to send directly to your Leanback Docs TV application.</p>

        <div id="dropzone" class="border-2 border-dashed border-white/10 rounded-[32px] p-12 mb-8 hover:border-blue-500/50 hover:bg-blue-600/5 transition-all cursor-pointer group">
            <input type="file" id="fileInput" class="hidden">
            <div class="flex flex-col items-center gap-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600 group-hover:text-blue-400 transition-colors"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span class="text-sm font-bold text-slate-500 uppercase tracking-widest">Click or Drag & Drop</span>
            </div>
        </div>

        <div id="status" class="hidden">
            <div class="flex items-center justify-center gap-3 text-emerald-400 bg-emerald-950/30 px-6 py-4 rounded-2xl border border-emerald-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span class="text-sm font-bold uppercase tracking-wide">File Sent Successfully</span>
            </div>
            <button onclick="location.reload()" class="mt-6 text-sm font-bold text-blue-400 hover:text-blue-300">Send Another File</button>
        </div>

        <div id="loading" class="hidden">
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
            </div>
            <p class="text-xs font-bold text-slate-600 mt-4 uppercase tracking-[0.2em]">Uploading to TV...</p>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const loading = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');

        dropzone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) uploadFile(file);
        };

        dropzone.ondragover = (e) => {
            e.preventDefault();
            dropzone.classList.add('border-blue-500/50', 'bg-blue-600/5');
        };

        dropzone.ondragleave = () => {
            dropzone.classList.remove('border-blue-500/50', 'bg-blue-600/5');
        };

        dropzone.ondrop = (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        };

        async function uploadFile(file) {
            dropzone.classList.add('hidden');
            loading.classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    progressBar.style.width = '100%';
                    setTimeout(() => {
                        loading.classList.add('hidden');
                        status.classList.remove('hidden');
                    }, 500);
                } else {
                    alert('Upload failed. Please try again.');
                    location.reload();
                }
            } catch (err) {
                alert('Connection error. Ensure you are on the same network.');
                location.reload();
            }
        }
    </script>
</body>
</html>
